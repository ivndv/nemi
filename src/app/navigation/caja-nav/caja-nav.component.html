<a
  [routerLink]="route"
  [routerLinkActive]="routerLinkActive"
  class="nav-button"
>
  @if (iconify) {
    <iconify-icon [icon]="iconify" class="nav-button-icon"></iconify-icon>
  } @else if (icon) {
    <img [src]="icon" [alt]="label + ' icono'" class="nav-button-icon" width="18" height="18" loading="eager" />
  }

  <p>{{ label }}</p>
</a>
