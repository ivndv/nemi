<nav>
  <!-- Contenedor principal de la barra de navegación -->
  <div class="navbar-container">
    <!-- Enlace a la página de inicio -->
    <app-caja-nav
      label="Inicio"
      route="/dashboard"
      icon="https://assets.mgdc.site/nemi/icono-inicio.png"
      routerLinkActive="active"
    ></app-caja-nav>

    <!-- Enlace a la gestión de activos -->
    <app-caja-nav
      label="Gestión de Activos"
      route="/gestion-activos"
      icon="https://assets.mgdc.site/nemi/icono-gestion-activos.png"
      routerLinkActive="active"
    ></app-caja-nav>

    <!-- Enlace a las asignaciones -->
    <app-caja-nav
      label="Asignaciones"
      route="/asignaciones"
      icon="https://assets.mgdc.site/nemi/icono-asignaciones.png"
      routerLinkActive="active"
    ></app-caja-nav>

    <!-- Enlace a los reportes -->
    @if (isAdmin()) {
      <app-caja-nav
        label="Reportes"
        route="/reportes"
        icon="https://assets.mgdc.site/nemi/icono-reportes.png"
        routerLinkActive="active"
      ></app-caja-nav>
    }

    <!-- Enlace a la configuración -->
    @if (isAdmin()) {
      <app-caja-nav
        label="Configuración"
        route="/configuracion"
        icon="https://assets.mgdc.site/nemi/icono-configuracion.png"
        routerLinkActive="active"
      ></app-caja-nav>
    }
  </div>
  <!-- Botón de Cerrar Sesión -->
  <div class="logout-button-container">
    <button class="logout-button" (click)="cerrarSesion()">
      <img src="https://assets.mgdc.site/nemi/logout.png" alt="Cerrar Sesión" />
      <p>Cerrar Sesión</p>
    </button>
  </div>
