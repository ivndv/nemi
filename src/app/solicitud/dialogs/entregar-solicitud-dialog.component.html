<app-modal-shell
  [title]="'Entregar a ' + data.solicitud.solicitante"
  subtitle="Selecciona el activo y la ubicación de entrega."
  (closed)="cancelar()"
>
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="activo_id">Activo</label>
        <select id="activo_id" formControlName="activo_id">
          <option [ngValue]="null" disabled>Selecciona un activo</option>
          @for (activo of data.activos; track activo.id) {
            <option [ngValue]="activo.id">{{ activo.nombre }}</option>
          }
        </select>
        @if (form.get("activo_id")?.touched && form.get("activo_id")?.invalid) {
          <small class="error-text">Selecciona un activo</small>
        }
      </div>

      <div class="form-group full-width">
        <label for="ubicacion_id">Ubicación</label>
        <select id="ubicacion_id" formControlName="ubicacion_id">
          <option [ngValue]="null" disabled>Selecciona una ubicación</option>
          @for (ubicacion of data.ubicaciones; track ubicacion.id) {
            <option [ngValue]="ubicacion.id">{{ ubicacion.nombre }}</option>
          }
        </select>
        @if (form.get("ubicacion_id")?.touched && form.get("ubicacion_id")?.invalid) {
          <small class="error-text">Selecciona una ubicación</small>
        }
      </div>
    </div>

    <footer class="actions-row">
      <button type="button" class="btn-secondary" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-primary">Entregar solicitud</button>
    </footer>
  </form>
</app-modal-shell>
