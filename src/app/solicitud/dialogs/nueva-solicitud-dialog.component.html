<app-modal-shell
  title="Nueva solicitud"
  subtitle="Cuéntanos qué necesitas y para qué."
  (closed)="cancelar()"
>
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-grid">
      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select id="tipo" formControlName="tipo">
          <option value="equipo">Equipo</option>
          <option value="licencia">Licencia</option>
          <option value="accesorio">Accesorio</option>
          <option value="reemplazo">Reemplazo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="prioridad">Prioridad</label>
        <select id="prioridad" formControlName="prioridad">
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="tipo_activo_id">Tipo de activo (opcional)</label>
        <select id="tipo_activo_id" formControlName="tipo_activo_id">
          <option [ngValue]="null">Cualquiera</option>
          @for (tipo of data.tipos; track tipo.id) {
            <option [ngValue]="tipo.id">{{ tipo.nombre }}</option>
          }
        </select>
      </div>

      <div class="form-group full-width">
        <label for="motivo">Motivo</label>
        <textarea id="motivo" formControlName="motivo" placeholder="¿Para qué lo necesitas?"></textarea>
        @if (form.get("motivo")?.touched && form.get("motivo")?.invalid) {
          <small class="error-text">Explica el motivo (mínimo 5 caracteres)</small>
        }
      </div>
    </div>

    <footer class="actions-row">
      <button type="button" class="btn-secondary" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-primary">Enviar solicitud</button>
    </footer>
  </form>
</app-modal-shell>
