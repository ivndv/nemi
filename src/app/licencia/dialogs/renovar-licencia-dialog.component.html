<app-modal-shell
  title="Registrar renovación"
  [subtitle]="data.licencia.nombre"
  (closed)="cancelar()"
>
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-grid">
      <div class="form-group">
        <label for="fecha">Fecha de renovación</label>
        <input id="fecha" type="date" formControlName="fecha" />
        @if (form.get("fecha")?.touched && form.get("fecha")?.invalid) {
          <small class="error-text">La fecha es obligatoria</small>
        }
      </div>

      <div class="form-group">
        <label for="asientos">Asientos</label>
        <input id="asientos" type="number" min="1" formControlName="asientos" />
        @if (form.get("asientos")?.touched && form.get("asientos")?.invalid) {
          <small class="error-text">Debe haber al menos 1 asiento</small>
        }
      </div>

      <div class="form-group full-width">
        <label for="costo">Costo</label>
        <input id="costo" type="number" min="0" step="0.01" formControlName="costo" placeholder="0.00" />
      </div>
    </div>

    <footer class="actions-row">
      <button type="button" class="btn-secondary" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-primary">Guardar renovación</button>
    </footer>
  </form>
</app-modal-shell>
